<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Venice Shell</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;color:#e8e8ea;
    font:15px/1.7 system-ui,-apple-system,"Hiragino Sans",sans-serif}
  main{height:100%;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:14px;text-align:center;padding:24px}
  h1{margin:0;font-size:20px;font-weight:600}
  p{margin:0;color:#8a8a92;font-size:13px;max-width:32em}
  button,a{color:#fff;text-decoration:none;border:1px solid #333;border-radius:999px;
    padding:12px 20px;font-size:14px;background:transparent;cursor:pointer}
  button:hover,a:hover{background:#1a1a1d}
</style>
</head>
<body>
<main>
  <h1>Venice Shell</h1>
  <p id="msg">セットアップ中…</p>
  <a id="go" href="chat/agent" hidden>チャットを開く</a>
</main>
<script>
(function () {
  var msg = document.getElementById('msg');
  var go  = document.getElementById('go');
  var base = location.pathname.replace(/[^\/]*$/, '');
  go.href = base + 'chat/agent';

  if (!('serviceWorker' in navigator)) {
    msg.textContent = 'Service Worker 非対応ブラウザです。';
    go.hidden = false; return;
  }

  navigator.serviceWorker.register(base + 'sw.js', {scope: base})
    .then(function () { return navigator.serviceWorker.ready; })
    .then(function () {
      msg.textContent = '起動中…';
      location.replace(go.href);
    })
    .catch(function (e) {
      msg.textContent = 'セットアップに失敗しました: ' + (e && e.message || e);
      go.hidden = false;
    });
})();
</script>
</body>
</html>
